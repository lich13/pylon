[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylon-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "markdown-it-py==4.0.0", "google-api-python-client>=2.0,<3", "google-auth-oauthlib>=1.2,<2", "playwright>=1.51,<2", "PyYAML>=6,<7"]

[project.scripts]
pylon = "pylon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
