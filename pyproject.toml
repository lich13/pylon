[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylon-gateway"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "markdown-it-py==4.2.0"]

[project.scripts]
pylon = "pylon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
