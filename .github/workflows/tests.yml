name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, webops, core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e . && python -m pip install pytest==9.1.1
      - name: Regression tests
        env:
          PYLON_HOME: ${{ runner.temp }}/pylon
          PYLON_PROFILE_ROOT: ${{ runner.temp }}/pylon/profiles/${{ matrix.profile }}
          PYTHONPATH: src:tasks/${{ matrix.profile }}:tasks/${{ matrix.profile }}/scripts
        run: |
          mkdir -p "$PYLON_PROFILE_ROOT"
          if [ '${{ matrix.profile }}' = core ]; then
            python -m pytest -q tests
          else
            python -m pytest -q tasks/${{ matrix.profile }}/tests
          fi
