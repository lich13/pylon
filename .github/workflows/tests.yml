name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e . && python -m pip install pytest==9.1.1
      - run: python -m pytest -q tests
      - run: node --test tools/linuxdo/linuxdo-following.test.mjs
      - run: npm test --prefix tools/chiphell
  intelligence-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Install isolated browser runtime
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright" python -m playwright install --with-deps --only-shell chromium
      - run: python scripts/ci/intelligence-web.py
      - run: python scripts/ci/daily-review-web.py
