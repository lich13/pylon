name: Rust gateway
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tests/rust_contract/requirements.lock
      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Gateway contracts
        env:
          PYLON_GATEWAY_BIN: ${{ github.workspace }}/target/release/pylon
        run: python -m pytest -q tests/rust_contract
      - name: Root broker and module deployment
        env:
          PYLON_GATEWAY_BIN: ${{ github.workspace }}/target/release/pylon
        run: sudo --preserve-env=PYLON_GATEWAY_BIN "$(which python)" -m pytest -q tests/rust_contract/test_gateway_security.py tests/rust_contract/test_module_activation_linux.py tests/rust_contract/test_legacy_job_locks.py
      - name: Package Linux gateway
        run: |
          mkdir -p dist
          cp target/release/pylon dist/pylon-linux-x86_64
          sha256sum dist/pylon-linux-x86_64 > dist/SHA256SUMS
          git rev-parse HEAD > dist/REVISION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pylon-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14
