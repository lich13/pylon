name: External module checks
run-name: Modules ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: Unique temporary input identifier
        required: true
      release_id:
        description: Private draft release containing the source bundle
        required: true
      sha256:
        description: SHA-256 of the source archive
        required: true
      core_sha:
        description: Gateway commit to validate against
        required: true
      module:
        description: Module and its dependants, or all
        default: all
        required: true
      router:
        description: Build Linux ARM64 router images
        type: boolean
        default: false
permissions: {}
jobs:
  input:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate and download private source
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.sha256 }}
          CORE_SHA: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          [[ "$JOB" =~ ^[a-f0-9]{24}$ && "$RELEASE_ID" =~ ^[0-9]+$ && "$SOURCE_SHA" =~ ^[a-f0-9]{64}$ && "$CORE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json,os,subprocess,hashlib
          from pathlib import Path
          release=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          assert release['draft'] and release['tag_name']=='pylon-input-'+os.environ['JOB']
          assert release['target_commitish']==os.environ['CORE_SHA']
          asset=next(a for a in release['assets'] if a['name']=='source.tar.gz')
          assert 0 < asset['size'] < 64*1024**2
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('owned=true\n')
          data=subprocess.check_output(['gh','api','-H','Accept: application/octet-stream',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}"])
          assert hashlib.sha256(data).hexdigest()==os.environ['SOURCE_SHA']
          (Path(os.environ['RUNNER_TEMP'])/'source.tar.gz').write_bytes(data)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-input-${{ inputs.job }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Delete temporary draft
        if: always() && steps.input.outputs.owned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
  build-runtime:
    needs: input
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.16', '3.14.10']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.core_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-input-${{ inputs.job }}
          path: ${{ runner.temp }}/input
      - name: Extract verified modules
        env:
          SOURCE_SHA: ${{ inputs.sha256 }}
        run: |
          python - <<'PY'
          import os,tarfile,hashlib,json
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'])/'input/source.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['SOURCE_SHA']
          source=Path(os.environ['RUNNER_TEMP'])/'pylon-tasks'
          seen=set();total=0
          with tarfile.open(archive) as bundle:
              for member in bundle:
                  path=Path(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts and member.name not in seen
                  total+=member.size;assert total<128*1024**2
                  seen.add(member.name);target=source/path;target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as output: output.write(bundle.extractfile(member).read())
                  target.chmod(0o755 if member.mode&0o111 else 0o644)
          modules=[p.parent for p in source.glob('*/module.json')]
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('PYLON_MODULES_DIR='+str(source)+'\n')
              output.write('PYLON_GATEWAY_ROOT='+os.environ['GITHUB_WORKSPACE']+'\n')
              output.write('PYTHONPATH='+os.pathsep.join([str(source/'sdk/src'),str(source/'privileged/src'),str(source),*(str(p/'src') for p in modules)])+'\n')
              output.write('PLAYWRIGHT_BROWSERS_PATH='+os.environ['RUNNER_TEMP']+'/playwright\n')
          PY
      - name: CPython build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev libncurses-dev uuid-dev libgdbm-dev libgdbm-compat-dev tk-dev
      - name: Build and relocate the exact offline runtime
        env:
          CORE_SHA: ${{ inputs.core_sha }}
          SOURCE_SHA: ${{ inputs.sha256 }}
        run: python3 "$PYLON_MODULES_DIR/deployment/build_runtime.py" --source "$PYLON_MODULES_DIR" --work "$RUNNER_TEMP/runtime-build" --python '${{ matrix.python }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-runtime-${{ inputs.job }}-${{ matrix.python }}
          path: ${{ runner.temp }}/runtime-build/dist
          retention-days: 1
          if-no-files-found: error
  checks:
    needs: [input, build-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12.16'
            node: '22.23.4'
            candidate: false
          - python: '3.12.16'
            node: '24.22.1'
            candidate: false
          - python: '3.14.10'
            node: '22.23.4'
            candidate: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.core_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-input-${{ inputs.job }}
          path: ${{ runner.temp }}/input
      - name: Extract verified modules
        env:
          SOURCE_SHA: ${{ inputs.sha256 }}
        run: |
          python - <<'PY'
          import os,tarfile,hashlib,json
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'])/'input/source.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['SOURCE_SHA']
          source=Path(os.environ['RUNNER_TEMP'])/'pylon-tasks'
          seen=set();total=0
          with tarfile.open(archive) as bundle:
              for member in bundle:
                  path=Path(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts and member.name not in seen
                  total+=member.size;assert total<128*1024**2
                  seen.add(member.name);target=source/path;target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as output: output.write(bundle.extractfile(member).read())
                  target.chmod(0o755 if member.mode&0o111 else 0o644)
          modules=[p.parent for p in source.glob('*/module.json')]
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('PYLON_MODULES_DIR='+str(source)+'\n')
              output.write('PYLON_GATEWAY_ROOT='+os.environ['GITHUB_WORKSPACE']+'\n')
              output.write('PYTHONPATH='+os.pathsep.join([str(source/'sdk/src'),str(source/'privileged/src'),str(source),*(str(p/'src') for p in modules)])+'\n')
              output.write('PLAYWRIGHT_BROWSERS_PATH='+os.environ['RUNNER_TEMP']+'/playwright\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-runtime-${{ inputs.job }}-${{ matrix.python }}
          path: ${{ runner.temp }}/built-runtime
      - name: Install the CI runtime offline
        run: |
          python3 - <<'PYCODE'
          import json,os,sys,subprocess,uuid
          from pathlib import Path
          sys.path.insert(0,str(Path(os.environ['PYLON_MODULES_DIR'])/'deployment'))
          from runtime import digest,extract,install
          stage=Path(os.environ['RUNNER_TEMP']); artifact=stage/'built-runtime'
          metadata=json.loads((artifact/'runtime.json').read_text())
          assert digest(artifact/'pylon-runtime.tar.gz') == metadata['sha256']
          # Root tests drop privileges; the runner's private temp parent is not traversable.
          root=Path('/tmp')/('pylon-runtime-'+uuid.uuid4().hex)
          extract(artifact/'pylon-runtime.tar.gz',root)
          install(root,lambda args: subprocess.check_output([str(x) for x in args],text=True))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('RUNTIME_PYTHON='+str(root/'venv/bin/python')+'\n')
              output.write('PLAYWRIGHT_BROWSERS_PATH='+str(root/'browsers')+'\n')
          with open(os.environ['GITHUB_PATH'],'a') as output:
              output.write(str(root/'venv/bin')+'\n')
          PYCODE
      - name: Test dependencies and browser libraries
        run: |
          "$RUNTIME_PYTHON" -m pip install --require-hashes -r tests/rust_contract/requirements.txt
          "$RUNTIME_PYTHON" -m playwright install-deps chromium
      - name: Fetch matching successful gateway CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow tests.yml --commit "$CORE_SHA" --status success --json databaseId --jq '.[0].databaseId')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run download "$run_id" --name pylon-linux-x86_64 --dir "$RUNNER_TEMP/gateway"
          [[ $(cat "$RUNNER_TEMP/gateway/REVISION") == "$CORE_SHA" ]]
          python3 - <<'PYCODE'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gateway'
          checksum,name=(root/'SHA256SUMS').read_text().split()
          assert name in ('pylon-linux-x86_64','dist/pylon-linux-x86_64')
          assert hashlib.sha256((root/'pylon-linux-x86_64').read_bytes()).hexdigest()==checksum
          (root/'pylon-linux-x86_64').chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('PYLON_GATEWAY_BIN='+str(root/'pylon-linux-x86_64')+'\n')
          PYCODE
      - name: Runtime compatibility
        id: compatibility
        continue-on-error: ${{ matrix.candidate }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pylon_sdk.tools check "$MODULE"
          "$RUNTIME_PYTHON" "$PYLON_MODULES_DIR/content/ci/browser-smoke.py"
          "$RUNTIME_PYTHON" -m pytest -q tests/rust_contract
          sudo --preserve-env=PYLON_GATEWAY_BIN "$RUNTIME_PYTHON" -m pytest -q tests/rust_contract/test_gateway_security.py tests/rust_contract/test_module_activation_linux.py tests/rust_contract/test_legacy_job_locks.py
          "$RUNTIME_PYTHON" -m pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.compatibility.outcome == 'success' && matrix.node == '22.23.4'
        with:
          name: compatible-runtime-${{ inputs.job }}-${{ matrix.python }}
          path: ${{ runner.temp }}/built-runtime/runtime.json
          retention-days: 1
          if-no-files-found: error
      - name: Record compatibility result
        if: always()
        run: echo 'Python ${{ matrix.python }} / Node ${{ matrix.node }} compatibility = ${{ steps.compatibility.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: inputs.router && matrix.python == '3.12.16' && matrix.node == '22.23.4'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: inputs.router && matrix.python == '3.12.16' && matrix.node == '22.23.4'
      - name: Router images
        if: inputs.router && matrix.python == '3.12.16' && matrix.node == '22.23.4'
        run: bash "$PYLON_MODULES_DIR/content/tools/chiphell/cloud/build-router-images.sh" "$PYLON_MODULES_DIR/content/tools/chiphell" "$RUNNER_TEMP/router-artifacts"
  package:
    if: inputs.module == 'all'
    needs: [input, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.core_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: module-input-${{ inputs.job }}
          path: ${{ runner.temp }}/input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: compatible-runtime-${{ inputs.job }}-*
          path: ${{ runner.temp }}/runtimes
      - name: Package verified SDK and modules
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
          SOURCE_SHA: ${{ inputs.sha256 }}
          CORE_SHA: ${{ inputs.core_sha }}
          RUNTIMES_DIR: ${{ runner.temp }}/runtimes
        run: python scripts/package-external.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pylon-external-${{ inputs.job }}
          path: ${{ runner.temp }}/external-dist
          retention-days: 30
          if-no-files-found: error
  cleanup:
    if: always()
    needs: [input, build-runtime, checks, package]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Remove workflow intermediate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          job=os.environ['JOB']
          if not re.fullmatch('[a-f0-9]{24}',job):
              raise ValueError('invalid module job identifier')
          repo=os.environ['GITHUB_REPOSITORY']
          run=os.environ['GITHUB_RUN_ID']
          # Collect every page before deletion, so pagination cannot skip shifted items.
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100'],text=True))
          artifacts=[item for page in pages for item in page['artifacts']
                     if item['name']=='module-input-'+job
                     or item['name'].startswith(('built-runtime-'+job+'-','compatible-runtime-'+job+'-'))]
          for item in artifacts:
              subprocess.run(['gh','api','--method','DELETE',f"repos/{repo}/actions/artifacts/{item['id']}"],check=True)
          print(f'Removed {len(artifacts)} intermediate artifacts')
          PY
