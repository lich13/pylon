name: Development environments

on:
  push:
    branches: [main]
    paths: ['requirements.lock', 'src/pylon/shared/playwright_env.py', 'tools/chiphell/**', 'scripts/ci/**', '.github/workflows/dev-environments.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set isolated browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python scripts/ci/browser-smoke.py
  router-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify ARM64 images
        run: bash tools/chiphell/cloud/build-router-images.sh "$GITHUB_WORKSPACE/tools/chiphell" "$RUNNER_TEMP/chiphell-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: router-images-arm64
          path: ${{ runner.temp }}/chiphell-artifacts/*
          if-no-files-found: error
          retention-days: 3
