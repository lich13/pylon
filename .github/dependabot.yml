version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      rust-compatible:
        applies-to: version-updates
        patterns: ['*']
      rust-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /tests/rust_contract
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      python-compatible:
        applies-to: version-updates
        patterns: ['*']
      python-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
